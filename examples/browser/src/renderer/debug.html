<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLPage Debug Panel</title>
  <link rel="stylesheet" href="css/tailwind.min.css">
  <link rel="stylesheet" href="css/debug.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/materialdesignicons.min.css">
</head>
<body class="bg-gray-900 text-white overflow-hidden h-screen flex flex-col">
  <header class="bg-gray-800 h-10 flex items-center px-3">
    <div class="flex items-center">
      <i class="mdi mdi-bug-outline text-lg mr-2"></i>
      <span class="text-sm font-medium">LLPage Debug Panel</span>
    </div>
  </header>

  <div class="flex flex-1 overflow-hidden">
    <!-- 左侧面板：页面列表 -->
    <div class="w-1/3 border-r border-gray-700 flex flex-col">
      <div class="bg-gray-800 p-2 flex items-center justify-between">
        <h2 class="text-sm font-semibold">Pages</h2>
        <div class="text-xs bg-gray-700 px-2 py-0.5 rounded-full">
          <span id="page-count">0</span> / <span id="max-size">0</span>
        </div>
      </div>
      <div id="pages-list" class="flex-1 overflow-y-auto p-2 space-y-1">
        <!-- 页面列表项会被动态添加 -->
      </div>
    </div>

    <!-- 右侧面板：详情和日志 -->
    <div class="flex-1 flex flex-col">
      <!-- LLPageManager 状态 -->
      <div class="bg-gray-800 p-3 border-b border-gray-700">
        <h2 class="text-sm font-semibold mb-2">LLPageManager Status</h2>
        <div class="grid grid-cols-3 gap-2 text-xs">
          <div class="bg-gray-700 p-2 rounded">
            <div class="text-gray-400 mb-1">Size</div>
            <div id="llpage-size" class="font-semibold">-</div>
          </div>
          <div class="bg-gray-700 p-2 rounded">
            <div class="text-gray-400 mb-1">Is Full</div>
            <div id="llpage-is-full" class="font-semibold">-</div>
          </div>
          <div class="bg-gray-700 p-2 rounded">
            <div class="text-gray-400 mb-1">Is Empty</div>
            <div id="llpage-is-empty" class="font-semibold">-</div>
          </div>
          <div class="bg-gray-700 p-2 rounded">
            <div class="text-gray-400 mb-1">Running Page</div>
            <div id="llpage-running-page" class="font-semibold">-</div>
          </div>
          <div class="bg-gray-700 p-2 rounded">
            <div class="text-gray-400 mb-1">Page List Size</div>
            <div id="llpage-list-size" class="font-semibold">-</div>
          </div>
          <div class="bg-gray-700 p-2 rounded">
            <div class="text-gray-400 mb-1">LRU Cache Size</div>
            <div id="llpage-lru-size" class="font-semibold">-</div>
          </div>
        </div>
      </div>

      <!-- 页面详情 -->
      <div id="page-details" class="p-3 hidden">
        <h2 class="text-sm font-semibold mb-2">Page Details</h2>
        <div class="bg-gray-800 p-3 rounded border border-gray-700 text-xs">
          <div class="grid grid-cols-2 gap-2">
            <div>
              <span class="text-gray-400">ID:</span>
              <span id="page-id" class="ml-1">-</span>
            </div>
            <div>
              <span class="text-gray-400">URL:</span>
              <span id="page-url" class="ml-1 break-all">-</span>
            </div>
            <div>
              <span class="text-gray-400">Title:</span>
              <span id="page-title" class="ml-1">-</span>
            </div>
            <div>
              <span class="text-gray-400">Is Running:</span>
              <span id="page-is-running" class="ml-1">-</span>
            </div>
            <div>
              <span class="text-gray-400">Is Dead:</span>
              <span id="page-is-dead" class="ml-1">-</span>
            </div>
            <div>
              <span class="text-gray-400">Is Eliminated:</span>
              <span id="page-is-eliminated" class="ml-1">-</span>
            </div>
            <div>
              <span class="text-gray-400">Elimination Count:</span>
              <span id="page-elimination-count" class="ml-1">-</span>
            </div>
            <div>
              <span class="text-gray-400">Is Pin:</span>
              <span id="page-is-pin" class="ml-1">-</span>
            </div>
          </div>
        </div>
      </div>

      <!-- 生命周期日志 -->
      <div class="flex-1 p-3 overflow-hidden flex flex-col">
        <div class="flex justify-between items-center mb-2">
          <h2 class="text-sm font-semibold">Lifecycle Events</h2>
          <button id="clear-logs" class="text-xs px-2 py-1 bg-gray-700 hover:bg-gray-600 rounded">
            Clear
          </button>
        </div>
        <div class="flex-1 overflow-y-auto bg-gray-800 p-2 rounded border border-gray-700">
          <pre id="lifecycle-log" class="text-xs font-mono text-gray-300"></pre>
        </div>
      </div>

      <!-- 工具栏 -->
      <div class="bg-gray-800 p-2 flex space-x-2 border-t border-gray-700">
        <button id="refresh-status" class="text-xs px-3 py-1.5 bg-blue-600 hover:bg-blue-700 rounded">
          Refresh Status
        </button>
        <button id="create-test-tab" class="text-xs px-3 py-1.5 bg-green-600 hover:bg-green-700 rounded">
          Create Test Tab
        </button>
        <button id="close-all-tabs" class="text-xs px-3 py-1.5 bg-red-600 hover:bg-red-700 rounded">
          Close All Tabs
        </button>
      </div>
    </div>
  </div>

  <!-- 模板 -->
  <template id="page-item-template">
    <div class="page-item p-2 rounded bg-gray-800 hover:bg-gray-700 cursor-pointer" data-page-id="">
      <div class="flex justify-between items-center">
        <div class="font-medium text-sm truncate"></div>
        <div class="flex space-x-1">
          <span class="status-badge px-1 py-0.5 rounded text-xs"></span>
        </div>
      </div>
      <div class="text-xs text-gray-400 truncate"></div>
    </div>
  </template>
  
  <!-- 脚本 -->
  <script src="js/debug.js"></script>
</body>
</html>
