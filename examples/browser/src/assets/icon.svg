  <circle cx="32" cy="32" r="30" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  
  <!-- 浏览器窗口 -->
  <rect x="12" y="16" width="40" height="32" rx="4" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  
  <!-- 标题栏 -->
  <rect x="12" y="16" width="40" height="8" rx="4" fill="#f3f4f6"/>
  <rect x="12" y="20" width="40" height="4" fill="#ffffff"/>
  
  <!-- 窗口控制按钮 -->
  <circle cx="18" cy="20" r="1.5" fill="#ef4444"/>
  <circle cx="23" cy="20" r="1.5" fill="#f59e0b"/>
  <circle cx="28" cy="20" r="1.5" fill="#10b981"/>
  
  <!-- 地址栏 -->
