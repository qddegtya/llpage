  <rect x="18" y="40" width="20" height="0.5" rx="0.25" fill="#6b7280"/>
  <rect x="18" y="42" width="16" height="0.5" rx="0.25" fill="#6b7280"/>
  
  <!-- LLPage标识 -->
  <text x="32" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#ffffff" font-weight="700" text-anchor="middle">LL</text>
